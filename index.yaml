  intent:
  - 卖惨
  - 自嘲
  - 表达破防
  - 活跃气氛
  tone:
  - 可怜
  - 搞笑
  - 夸张
  - 不严肃
  intensity: 3
  tags:
  - 哭了
  - 破防
  - 委屈
  - 唱歌
  - 卖惨
  - 难受
  - 哈哈但哭
  suitable_when:
  - 自己或对方在轻松语境里表达小小崩溃
  - 群聊里有人调侃自己，可以用来搞笑接梗
  - 想表达“我破防了，但还能开玩笑”
