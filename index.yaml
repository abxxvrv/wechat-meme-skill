schema_version: '1.0'
language: zh-CN
description: 微信表情包发送 skill 的本地表情包语义索引。表情包文件位于 stickers/ 目录，file 字段为相对路径；可发送文件只能是图片或 mp4。
selection_policy:
  default_use: 当 agent 有想表达的轻松、感性、可爱、玩梗、安慰或接话内容时，优先考虑使用本技能选择表情包；用户明确要求发表情包时直接使用。
  prefer: 优先选择语义、情绪、意图和聊天节奏最贴合的表情包；intensity 用来控制表达强度，不作为默认压低表情表达的理由。
  avoid:
  - 不要用表情包替代必要的信息、实际帮助、认真道歉或清晰说明
  - 对方处在危机、强烈痛苦、正式争执、技术排错等需要直接回应的场景
  - 关系不熟时使用亲密、暧昧、阴阳怪气、嘲讽类表情包
  - 同一表情包短时间内反复发送
  intensity_scale:
    1: 极轻，几乎不打断对话
    2: 轻度，可爱/温和
    3: 中等，有明显情绪或梗
    4: 较强，可能带嘲讽、玩梗或冒犯感
    5: 强烈，默认不建议自动使用
stickers:
- id: duck_crying_guitar_01
